<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png">
    <title>Les questions de Lio</title>
    <meta name="description" content="Né grâce à notre cher lionel, découvrez des centaines de questions amusantes, profondes et originales pour animer vos soirées entre amis, en couple ou en famille.">
    <link rel="canonical" href="https://lio.metrow.fr/">
    <script type="application/ld+json">
    {
        "@context":"https://schema.org",
        "@type":"WebSite",
        "name":"Les Questions de Lio",
        "url":"https://lio.metrow.fr",
        "description":"Générateur de questions pour soirées et discussions."
    }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="components/nav.js" defer></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5549211350664143"
     crossorigin="anonymous"></script>
</head>
<body>

    <div class="container">
        <h1>Les questions de Lio</h1>
        <p class="subtitle">Trouvez des sujets de discussion pour vos soirées</p>

        <!-- Filtres par catégories -->
        <div class="filters">
            <button class="filter-btn active" onclick="setCategory('all')">Tout</button>
            <button class="filter-btn" onclick="setCategory('chill_et_loisirs')">Chill</button>
            <button class="filter-btn" onclick="setCategory('ego_et_personnalite')">Ego</button>
            <button class="filter-btn" onclick="setCategory('profond_et_philosophique')">Profond</button>
            <button class="filter-btn" onclick="setCategory('romance_et_sexe')">Intime</button>
            <button class="filter-btn" onclick="setCategory('relations_et_groupe')">Relations</button>
            <button class="filter-btn" onclick="setCategory('enfance_et_passé')">Nostalgie</button>
            <button class="filter-btn" onclick="setCategory('notes_sur_10_et_echelles')">Notes /10</button>
        </div>

        <!-- Zone d'affichage simplifiée (sans flip 3D) -->
        <div class="display-box" id="displayBox">
            <span class="badge hidden" id="badge">Catégorie</span>
            <div class="question-text" id="questionText">Cliquez sur le bouton ci-dessous pour piocher une question !</div>
            <div class="vibe-text" id="vibeText"></div>
        </div>

        <!-- Bouton d'action -->
        <button class="action-btn" onclick="drawQuestion()">Question Suivante ✨</button>
    </div>

    <div class="suggestion-container">
        <button class="suggest-toggle-btn" id="toggleFormBtn" onclick="toggleSuggestionForm()">Proposer une question 💡</button>
        
        <form id="suggestionForm" class="suggestion-form hidden" onsubmit="handleFormSubmit(event)">
            <input type="text" id="suggestInput" placeholder="Votre question originale..." required>
            
            <select id="suggestCategory" required>
                <option value="" disabled selected>Choisir une catégorie...</option>
                <option value="chill_et_loisirs">Chill</option>
                <option value="ego_et_personnalite">Ego</option>
                <option value="profond_et_philosophique">Profond</option>
                <option value="romance_et_sexe">Intime</option>
                <option value="relations_et_groupe">Relations</option>
                <option value="enfance_et_passé">Nostalgie</option>
                <option value="notes_sur_10_et_echelles">Notes /10</option>
            </select>
            
            <button type="submit" class="submit-btn">Envoyer à Lio</button>
        </form>
    </div>

    <bottom-nav></bottom-nav>

    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
